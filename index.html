<html lang="pt-BR">
<head>

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --line:#d7deea;

      --muted:#6b7280;
      --pri:#4f46e5;
      --ok:#16a34a;
      --err:#dc2626;
      --warn:#d97706;
      --chip:#eef2ff;
      --chipHover:#e0e7ff;
      --track:#dbe3f0;
      --trackFill:#4f46e5;
      --thumb:#ffffff;
      --thumbBorder:#4f46e5;
      --thumb-size:22px;
      --track-height:8px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .wrap{max-width:1024px;margin:20px auto;padding:0 16px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:18px;
      box-shadow:0 6px 24px rgba(15,23,42,.05);
    }

    h1{margin:0 0 6px;font-size:1.45rem}
    .muted{color:var(--muted)}
    .hidden{display:none !important;}

    .status{
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px;
      margin:12px 0;
      font-size:14px;
      line-height:1.45;
    }
    .status.loading{background:#eef4ff;border-color:#bfd3ff;color:#24427a;}
    .status.ok{background:#ecfdf3;border-color:#86efac;color:#166534;}
    .status.err{background:#fef2f2;border-color:#fca5a5;color:#991b1b;}
    .status.warn{background:#fffbeb;border-color:#fcd34d;color:#92400e;}

    .grid-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 6px}
    @media (max-width:720px){.grid-info{grid-template-columns:1fr}}
    .info{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px
    }
    .info b{display:block;margin-bottom:4px;color:#111827}

    .legend{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
    .pill{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--chip);
      font-size:.86rem
    }

    .progressWrap{display:none;gap:8px;align-items:center;margin:8px 0 0}
    .progress{
      height:10px;
      background:#eef2f7;
      border:1px solid var(--line);
      border-radius:999px;
      overflow:hidden
    }
    .bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg, #4f46e5, #16a34a)
    }

    .item{
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      background:#fbfcfe;
      margin-bottom:12px
    }
    .item.invalid{
      border-color:#ef4444 !important;
      background:#fef2f2;
    }

    .stem{font-size:1rem;margin-bottom:10px}
    .scale{display:grid;gap:8px}
    .ends{display:flex;justify-content:space-between;align-items:flex-end}
    .ends span{font-size:.9rem;color:var(--muted)}

    .rail{
      position:relative;
      padding:10px 0 0;
    }

    input[type="range"]{
      width:100%;
      display:block;
      appearance:none;
      -webkit-appearance:none;
      background:transparent;
      height:var(--thumb-size);
      margin:0;
      padding:0;
    }

    input[type="range"]:focus{
      outline:none;
    }

    input[type="range"]::-webkit-slider-runnable-track{
      height:var(--track-height);
      border-radius:999px;
      background:linear-gradient(90deg, var(--track), var(--trackFill));
    }

    input[type="range"]::-moz-range-track{
      height:var(--track-height);
      border-radius:999px;
      background:linear-gradient(90deg, var(--track), var(--trackFill));
    }

    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;
      appearance:none;
      width:var(--thumb-size);
      height:var(--thumb-size);
      border-radius:999px;
      background:var(--thumb);
      border:3px solid var(--thumbBorder);
      margin-top:calc((var(--track-height) - var(--thumb-size)) / 2);
      cursor:pointer;
      box-shadow:0 1px 4px rgba(0,0,0,.15);
    }

    input[type="range"]::-moz-range-thumb{
      width:var(--thumb-size);
      height:var(--thumb-size);
      border-radius:999px;
      background:var(--thumb);
      border:3px solid var(--thumbBorder);
      cursor:pointer;
      box-shadow:0 1px 4px rgba(0,0,0,.15);
    }

    .ticks{
      position:relative;
      width:calc(100% - var(--thumb-size));
      margin-left:calc(var(--thumb-size) / 2);
      height:20px;
      margin-top:8px;
    }

    .tick{
      position:absolute;
      top:0;
      transform:translateX(-50%);
      font-size:.85rem;
      color:var(--muted);
      line-height:1;
      white-space:nowrap;
    }

    .tick:first-child{
      left:0% !important;
      transform:translateX(0);
    }

    .tick:last-child{
      left:100% !important;
      transform:translateX(-100%);
    }

    .valpill{
      display:inline-block;
      font-weight:700;
      padding:4px 8px;
      border-radius:8px;
      background:#eef2ff;
      border:1px solid var(--line);
      min-width:40px;
      text-align:center
    }

    .controls{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      background:var(--pri);
      border:none;
      color:#fff;
      padding:12px 16px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600
    }
    .btn.ok{background:var(--ok)}
    .btn.ghost{
      background:#fff;
      border:1px solid var(--line);
      color:var(--text)
    }
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap
    }

    @media (max-width:720px){
      .actions .btn{
        width:100%;
        justify-content:center;
      }
    }
  </style>

    function maskCPF(cpf) {
      const d = onlyDigits(cpf || "");
      if (d.length !== 11) return cpf || "";
      return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`;
    }

    function fmtDateISO(iso) {
      if (!iso) return "";
      if (String(iso).includes("T")) {
        const dt = new Date(iso);
        if (!isNaN(dt)) return dt.toLocaleDateString("pt-BR");
      }
      const [y, m, d] = String(iso).split("-");
      return (y && m && d) ? `${d}/${m}/${y}` : iso;
    }

    function normalizeCPF(cpf) {
      return String(cpf || "").replace(/\D/g, "");

      const params = new URLSearchParams(window.location.search);
      return String(params.get("token") || params.get("t") || "").trim();

      if (window.__patientFormAccess?.cpf) return normalizeCPF(window.__patientFormAccess.cpf);

      const legacyCpf = params.get("cpf");
      if (legacyCpf) return normalizeCPF(legacyCpf);

      const raw = window.location.search.replace("?", "").trim();
      if (/^\d{11}$/.test(raw)) return raw;

    function isObject(v) {
      return v && typeof v === "object" && !Array.isArray(v);
    }

    function containsTestCode(jsonb, testCode) {
      if (!jsonb) return false;

      if (typeof jsonb === "string") return jsonb === testCode;

      if (Array.isArray(jsonb)) {
        return jsonb.some(item => {
          if (typeof item === "string") return item === testCode;
          if (isObject(item)) {
            return item.code === testCode || item.test_code === testCode || item.id === testCode || containsTestCode(item, testCode);
          }
          return false;
        });
      }

      if (isObject(jsonb)) {
        if (Object.prototype.hasOwnProperty.call(jsonb, testCode)) {
          const value = jsonb[testCode];
          if (value !== false && value !== null && value !== undefined) return true;
          return false;
        }

        if (jsonb.code === testCode || jsonb.test_code === testCode || jsonb.id === testCode) return true;

        return Object.values(jsonb).some(v => containsTestCode(v, testCode));
      }

      return false;
    }

    function isTestLiberado(testsLiberados, testCode) {
      if (!containsTestCode(testsLiberados, testCode)) return false;

      if (isObject(testsLiberados) && Object.prototype.hasOwnProperty.call(testsLiberados, testCode)) {
        const v = testsLiberados[testCode];
        if (typeof v === "boolean") return v;
        if (isObject(v) && "liberado" in v) return Boolean(v.liberado);
        if (typeof v === "string") return !["false", "0", "nao", "não"].includes(v.toLowerCase());
        return Boolean(v);
      }

      return true;
    }

    function isTestFeito(testsFeitos, testCode) {
      if (!containsTestCode(testsFeitos, testCode)) return false;

      if (isObject(testsFeitos) && Object.prototype.hasOwnProperty.call(testsFeitos, testCode)) {
        const v = testsFeitos[testCode];
        if (typeof v === "boolean") return v;
        if (isObject(v) && "feito" in v) return Boolean(v.feito);
        if (typeof v === "string") return !["false", "0", "nao", "não"].includes(v.toLowerCase());
        return Boolean(v);
      }

      return true;
    }

    function normalizeTestsFeitosForSave(current) {
      const out = {};

      if (!current) return out;

      if (typeof current === "string") {
        out[current] = { feito: true };
        return out;
      }

      if (Array.isArray(current)) {
        current.forEach(item => {
          if (typeof item === "string") {
            out[item] = { feito: true };
          } else if (isObject(item)) {
            const code = item.code || item.test_code || item.id;
            if (code) {
              out[code] = {
                ...item,
                feito: ("feito" in item) ? Boolean(item.feito) : true
              };
            }
          }
        });
        return out;
      }

      if (isObject(current)) {
        Object.entries(current).forEach(([key, value]) => {
          if (typeof value === "boolean") {
            out[key] = { feito: value };
          } else if (typeof value === "string") {
            out[key] = { feito: !["false", "0", "nao", "não"].includes(value.toLowerCase()) };
          } else if (isObject(value)) {
            out[key] = { ...value };
          } else {
            out[key] = { feito: Boolean(value) };
          }
        });
      }

      return out;
    }

    function buildUpdatedTestsFeitos(currentTestsFeitos, testCode, submittedAtIso) {
      const next = normalizeTestsFeitosForSave(currentTestsFeitos);

      next[testCode] = {
        ...(isObject(next[testCode]) ? next[testCode] : {}),
        feito: true,
        submitted_at: submittedAtIso
      };

      return next;
    }

    function redirectToAreaPaciente() {
      const token = getTokenFromUrl();
      window.location.href = token ? `${AREA_PACIENTE_URL}?token=${encodeURIComponent(token)}` : AREA_PACIENTE_URL;
    }

    function getFieldNameByQuestionNumber(num) {
      return `q${String(num).padStart(3, "0")}`;
    }

    function renderPatientInfo(patient) {
      const g = $("#pacInfo");
      g.innerHTML = "";

      const info = [
        ["Nome", patient.nome || "-"],
        ["CPF", maskCPF(patient.cpf || "")],
        ["Nascimento", fmtDateISO(patient.data_nascimento || "")],
        ["E-mail", patient.email || "-"],
        ["WhatsApp", patient.whatsapp || "-"]
      ];

      info.forEach(([k, v]) => {
        const div = document.createElement("div");
        div.className = "info";
        div.innerHTML = `<b>${k}</b><div>${v || "-"}</div>`;
        g.appendChild(div);
      });

      g.classList.remove("hidden");
    }

    function renderQuestions() {
      const host = $("#qs");
      host.innerHTML = "";

      ITEMS.forEach((text, idx) => {
        const q = idx + 1;
        const qn = String(q).padStart(3, "0");

        const wrap = document.createElement("div");
        wrap.className = "item";
        wrap.setAttribute("data-q", String(q));
        wrap.setAttribute("data-field", `q${qn}`);

        const stem = document.createElement("div");
        stem.className = "stem";
        stem.id = `s${qn}`;
        stem.textContent = text;

        const scale = document.createElement("div");
        scale.className = "scale";

        const ends = document.createElement("div");
        ends.className = "ends";
        ends.innerHTML = `<span>Descreve-me muito mal</span><span>Descreve-me muito bem</span>`;

        const rail = document.createElement("div");
        rail.className = "rail";
        rail.innerHTML = `
          <input type="range" min="1" max="7" step="1" id="r${qn}" aria-labelledby="s${qn}">
          <div class="ticks">
            <div class="tick" style="left:0%">1</div>
            <div class="tick" style="left:16.6667%">2</div>
            <div class="tick" style="left:33.3333%">3</div>
            <div class="tick" style="left:50%">4</div>
            <div class="tick" style="left:66.6667%">5</div>
            <div class="tick" style="left:83.3333%">6</div>
            <div class="tick" style="left:100%">7</div>
          </div>
        `;

        const controls = document.createElement("div");
        controls.className = "controls";
        controls.innerHTML = `
          <span class="muted">Valor escolhido:</span>
          <span id="v${qn}" class="valpill">—</span>
          <button class="btn ghost" type="button" id="b${qn}">Limpar</button>
          <input type="hidden" name="q${qn}" id="h${qn}" value="">
        `;

        scale.append(ends, rail, controls);
        wrap.append(stem, scale);
        host.appendChild(wrap);

        const range = rail.querySelector(`#r${qn}`);
        const hidden = controls.querySelector(`#h${qn}`);
        const valpill = controls.querySelector(`#v${qn}`);
        const btnClear = controls.querySelector(`#b${qn}`);

        range.addEventListener("input", () => {
          hidden.value = range.value;
          valpill.textContent = range.value;
          wrap.classList.remove("invalid");
          updateProgress();
          saveDraft(false);
        });

        btnClear.addEventListener("click", () => {
          hidden.value = "";
          range.value = "1";
          valpill.textContent = "—";
          wrap.classList.remove("invalid");
          updateProgress();
          saveDraft(false);
        });
      });
    }

    const STORAGE_KEY = `BFP_${getCpfFromUrl() || "anon"}_${getTestCodeFromUrl() || TEST_CODE_FIXO}`;

    function saveDraft(showMessage = true) {
      const data = {};
      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(3, "0");
        const v = $(`#h${qn}`)?.value;
        if (v) data[`q${qn}`] = Number(v);
      }

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        if (showMessage) {
          setStatus("Rascunho salvo neste dispositivo.", "ok");
        }
      } catch (e) {
        console.warn("Falha ao salvar rascunho", e);
      }
    }

    function restoreDraft() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        const data = JSON.parse(raw);
        Object.entries(data || {}).forEach(([k, v]) => {
          const qn = k.replace("q", "");
          const hid = $(`#h${qn}`);
          const rng = $(`#r${qn}`);
          const pill = $(`#v${qn}`);
          if (hid && rng && pill) {
            hid.value = String(v);
            rng.value = String(v);
            pill.textContent = String(v);
          }
        });
      } catch (e) {
        console.warn("Falha ao restaurar rascunho", e);
      }
    }

    function clearDraft() {
      localStorage.removeItem(STORAGE_KEY);

      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(3, "0");
        const hid = $(`#h${qn}`);
        const rng = $(`#r${qn}`);
        const pill = $(`#v${qn}`);
        const row = document.querySelector(`.item[data-q="${i}"]`);
        if (hid) hid.value = "";
        if (rng) rng.value = "1";
        if (pill) pill.textContent = "—";
        if (row) row.classList.remove("invalid");
      }

      updateProgress();
      setStatus("Rascunho apagado.", "warn");
    }

    function countAnswered() {
      let c = 0;
      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(3, "0");
        if ($(`#h${qn}`)?.value) c++;
      }
      return c;
    }

    function updateProgress() {
      const a = countAnswered();
      const t = ITEMS.length;
      $("#progressText").textContent = `Progresso: ${a}/${t}`;
      $("#bar").style.width = `${(a / t) * 100}%`;
    }

    function formDataToObjectBFP() {
      const result = {};
      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(3, "0");
        const field = `q${qn}`;
        const value = $(`#h${qn}`)?.value || "";
        if (value !== "") result[field] = Number(value);
      }
      return result;
    }

    function invertLikert(v) {
      return v ? 8 - v : 0;
    }

    function getAdjustedAnswer(answersObj, questionNumber) {
      const key = getFieldNameByQuestionNumber(questionNumber);
      const raw = Number(answersObj[key] || 0);
      if (!raw) return 0;
      return INVERTED.has(questionNumber) ? invertLikert(raw) : raw;
    }

    function meanByQuestionNumbers(answersObj, questionNumbers) {
      const values = (questionNumbers || [])
        .map(n => getAdjustedAnswer(answersObj, n))
        .filter(v => v > 0);

      if (!values.length) return 0;
      return values.reduce((acc, v) => acc + v, 0) / values.length;
    }

    function buildScores(answersObj) {
      const sums = {};

      sums.vulnerabilidade = meanByQuestionNumbers(answersObj, VULNERABILIDADE);
      sums.instabilidade_emocional = meanByQuestionNumbers(answersObj, INSTAB_EMOC);
      sums.passividade = meanByQuestionNumbers(answersObj, PASSIVIDADE);
      sums.depressao = meanByQuestionNumbers(answersObj, DEPRESSAO);
      sums.neuroticismo = (sums.vulnerabilidade + sums.instabilidade_emocional + sums.passividade + sums.depressao) / 4;

      sums.comunicacao = meanByQuestionNumbers(answersObj, COMUNICACAO);
      sums.altivez = meanByQuestionNumbers(answersObj, ALTIVEZ);
      sums.dinamismo = meanByQuestionNumbers(answersObj, DINAMISMO);
      sums.interacoes_sociais = meanByQuestionNumbers(answersObj, INTERACOES_SOC);
      sums.extroversao = (sums.comunicacao + sums.altivez + sums.dinamismo + sums.interacoes_sociais) / 4;

      sums.amabilidade = meanByQuestionNumbers(answersObj, AMABILIDADE);
      sums.pro_sociabilidade = meanByQuestionNumbers(answersObj, PRO_SOC);
      sums.confianca_nas_pessoas = meanByQuestionNumbers(answersObj, CONFIANCA_PESS);
      sums.socializacao = (sums.amabilidade + sums.pro_sociabilidade + sums.confianca_nas_pessoas) / 3;

      sums.competencia = meanByQuestionNumbers(answersObj, COMPETENCIA);
      sums.ponderacao = meanByQuestionNumbers(answersObj, PONDERACAO);
      sums.empenho = meanByQuestionNumbers(answersObj, EMPENHO);
      sums.realizacao = (sums.competencia + sums.ponderacao + sums.empenho) / 3;

      sums.abertura_ideias = meanByQuestionNumbers(answersObj, AB_IDEIAS);
      sums.liberalismo = meanByQuestionNumbers(answersObj, LIBERALISMO);
      sums.busca_novidades = meanByQuestionNumbers(answersObj, BUSCA_NOV);
      sums.abertura = (sums.abertura_ideias + sums.liberalismo + sums.busca_novidades) / 3;

      let globalSum = 0;
      let globalN = 0;
      for (let i = 1; i <= ITEMS.length; i++) {
        const adjusted = getAdjustedAnswer(answersObj, i);
        if (!adjusted) continue;
        globalSum += adjusted;
        globalN++;
      }

      sums.media_global = globalN ? globalSum / globalN : 0;
      sums.total_respondido = globalN;

      return sums;
    }

    function buildResultsPerguntasRespostasBFP(answersObj) {
      const respostas = [];
      ITEMS.forEach((texto, idx) => {
        const qn = String(idx + 1).padStart(3, "0");
        const key = `q${qn}`;
        if (!Object.prototype.hasOwnProperty.call(answersObj, key)) return;
        respostas.push({
          pergunta_numero: idx + 1,
          pergunta: texto,
          resposta: answersObj[key]
        });
      });
      return respostas;
    }

function buildResultsMetaPayloadBFP(answersObj, durationSec) {
  const scores = buildScores(answersObj);

  const payload = Object.entries(INDICATORS_CONFIG).map(([key, cfg], index) => ({
    key: key,
    label: cfg.label,
    order: index + 1,
    value: Number((scores[key] || 0).toFixed(4))
  }));

  payload.push({
    key: "media_global",
    label: "Média global",
    order: payload.length + 1,
    value: Number((scores.media_global || 0).toFixed(4))
  });

  return payload;
}

    function validateAllAnswered() {
      document.querySelectorAll(".item.invalid").forEach(el => el.classList.remove("invalid"));

      for (let i = 1; i <= ITEMS.length; i++) {
        const qn = String(i).padStart(3, "0");
        const hid = $(`#h${qn}`);
        if (!hid || !hid.value) {
          const row = document.querySelector(`.item[data-q="${i}"]`);
          if (row) {
            row.classList.add("invalid");
            row.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          throw new Error(`Responda a questão ${i}.`);
        }
      }
    }

    async function getPatientFormAccessByToken() {
      const token = getTokenFromUrl();
      const testCode = getTestCodeFromUrl();

      if (!token || !testCode) {
        return { data: null, error: new Error("Link invalido ou formulario nao informado.") };
      }

      if (window.__patientFormAccess && window.__patientFormAccess.form_code === testCode) {
        return { data: window.__patientFormAccess, error: null };
      }

      if (!window.__patientFormAccessPromise) {
        window.__patientFormAccessPromise = supabaseClient
          .rpc("get_public_patient_form_access", {
            p_token: token,
            p_form_code: testCode
          })
          .then(({ data, error }) => {
            if (error) return { data: null, error };
            const row = Array.isArray(data) ? data[0] : data;
            window.__patientFormAccess = row || null;
            return { data: row || null, error: null };
          });
      }

      return window.__patientFormAccessPromise;
    }

    function installPatientTokenAccessShim() {
      if (!supabaseClient || supabaseClient.__patientTokenAccessShim) return;

      const originalFrom = supabaseClient.from.bind(supabaseClient);

      supabaseClient.from = function(table) {
        if (table !== "patients") return originalFrom(table);

        const selectBuilder = {
          select() { return this; },
          eq() { return this; },
          in() { return this; },
          limit() { return this; },
          order() { return this; },
          maybeSingle() { return getPatientFormAccessByToken(); },
          single() { return getPatientFormAccessByToken(); },
          async then(resolve, reject) {
            try {
              const result = await getPatientFormAccessByToken();
              return resolve(result);
            } catch (err) {
              if (reject) return reject(err);
              throw err;
            }
          }
        };

        return {
          select() { return selectBuilder; },
          update() {
            return {
              eq: async () => ({ data: null, error: null })
            };
          }
        };
      };

      supabaseClient.__patientTokenAccessShim = true;
    }


    async function validarAcessoAoTeste() {
      const cpf = getCpfFromUrl();
      const token = getTokenFromUrl();
      installPatientTokenAccessShim();
      const testCode = getTestCodeFromUrl();

      if (!token) {
        setStatus("Link invalido ou expirado. Abra o formulario pela area do paciente.", "err");
        return null;
      }

      if (!testCode) {
        setStatus("Código do teste não informado.", "err");
        return null;
      }

      $("#metaInfo").classList.remove("hidden");
      $("#metaInfo").innerHTML = `
        <span class="pill">Acesso por token</span>
        <span class="pill">Teste: ${testCode}</span>
      `;

      setStatus("Consultando liberação do teste...", "loading");

      const { data, error } = await supabaseClient
        .from("patients")
        .select("cpf, nome, data_nascimento, email, whatsapp, tests_liberados, tests_feitos")
        .eq("cpf", cpf)
        .maybeSingle();

      if (error) {
        console.error(error);
        setStatus("Erro ao consultar a base de dados.", "err");
        return null;
      }

      if (!data) {
        setStatus("CPF não encontrado.", "err");
        return null;
      }

      const liberado = isTestLiberado(data.tests_liberados, testCode);
      if (!liberado) {
        setStatus("Teste não liberado.", "warn");
        return null;
      }

      const feito = isTestFeito(data.tests_feitos, testCode);
      if (feito) {
        setStatus("Teste já realizado. Redirecionando para a área do paciente...", "ok");
        setTimeout(() => redirectToAreaPaciente(cpf), 700);
        return null;
      }

      setStatus("Teste liberado. Formulário disponível.", "ok");
      return data;
    }

    async function boot() {
      renderQuestions();
      restoreDraft();
      updateProgress();

      const patient = await validarAcessoAoTeste();
      if (!patient) return;

      patientGlobal = patient;
      startAt = Date.now();

      renderPatientInfo(patient);
      $("#formWrap").classList.remove("hidden");
      $("#progressWrap").classList.remove("hidden");
    }

    $("#btnSave")?.addEventListener("click", () => saveDraft(true));
    $("#clearDraft")?.addEventListener("click", clearDraft);

    $("#testForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = $("#submitBtn");
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Enviando...";

      try {
        if (!patientGlobal) throw new Error("Sessão inválida. Recarregue a página.");

        const cpf = getCpfFromUrl();
        const token = getTokenFromUrl();
        installPatientTokenAccessShim();
        const testCode = getTestCodeFromUrl();
        const submittedAt = new Date().toISOString();
        const durationSec = Math.round((Date.now() - startAt) / 1000);

        validateAllAnswered();

        const rawPayload = formDataToObjectBFP();
        const resultsPayload = buildResultsPerguntasRespostasBFP(rawPayload);
        const resultsMetaPayload = buildResultsMetaPayloadBFP(rawPayload, durationSec);

        const { data: patient, error: patientError } = await supabaseClient
          .from("patients")
          .select("cpf, tests_liberados, tests_feitos")
          .eq("cpf", cpf)
          .maybeSingle();

        if (patientError) {
          console.error(patientError);
          throw new Error("Erro ao consultar paciente.");
        }

        if (!patient) throw new Error("CPF não encontrado.");

        const liberado = isTestLiberado(patient.tests_liberados, testCode);
        if (!liberado) throw new Error("Teste não liberado.");

        const jaFeito = isTestFeito(patient.tests_feitos, testCode);
        if (jaFeito) {
          redirectToAreaPaciente(cpf);
          return;
        }

        const { error: insertError } = await supabaseClient
          .from("respostas")
          .insert([{
            cpf: cpf,
            code: testCode,
            submitted_at: submittedAt,
            results: resultsPayload,
            results_meta: resultsMetaPayload
          }]);

        if (insertError) {
          console.error("ERRO INSERT respostas:", insertError);
          throw new Error(
            `Erro ao salvar respostas: ${insertError.message || ""} ${insertError.details || ""} ${insertError.hint || ""}`.trim()
          );
        }

        const nextTestsFeitos = buildUpdatedTestsFeitos(patient.tests_feitos, testCode, submittedAt);

        const { error: updateError } = await supabaseClient
          .from("patients")
          .update({
            tests_feitos: nextTestsFeitos
          })
          .eq("cpf", cpf);

        if (updateError) {
          console.error(updateError);
          throw new Error("Resposta salva, mas falhou ao marcar teste como feito.");
        }

        clearDraft();
        setStatus("Respostas enviadas com sucesso. Redirecionando...", "ok");

        setTimeout(() => {
          redirectToAreaPaciente(cpf);
        }, 700);

      } catch (err) {
        console.error(err);
        setStatus(err?.message || "Erro ao enviar o formulário.", "err");
        alert(err?.message || "Erro ao enviar o formulário.");
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    boot();
  </script>
