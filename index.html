<style>
  :root{--bg:#0f172a;--card:#111827;--line:#1f2937;--text:#e5e7eb;--muted:#94a3b8;--pri:#4f46e5;--ok:#22c55e;--err:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto}
  .wrap{max-width:980px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  h1{margin:0 0 6px;font-size:1.35rem}
  .muted{color:var(--muted)}
  .grid-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
  @media(max-width:720px){.grid-info{grid-template-columns:1fr}}
  .info{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px}
  .info b{display:block;margin-bottom:4px;color:#cbd5e1}
  .legend{background:#0b1220;border:1px dashed var(--line);border-radius:10px;padding:10px;margin:6px 0 12px}

  .q{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0b1220}
  .q h3{margin:0 0 8px;font-size:1rem}
  .opts{display:flex;flex-wrap:wrap;gap:10px}
  label.opt{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .opt input[type="radio"]{accent-color:var(--pri)}
  /* botão inteiro azul quando marcado */
  label.opt:has(input[type="radio"]:checked){ background:var(--pri); border-color:var(--pri); color:#fff; }
  label.opt:has(input[type="radio"]:checked) span{ color:#fff; font-weight:600; }
  label.opt:has(input[type="radio"]:focus-visible){ box-shadow:0 0 0 3px rgba(79,70,229,.35); border-color:var(--pri); }

  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--pri);border:none;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}
  .btn.ok{background:var(--ok)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin:10px 0;padding:10px;border-radius:8px}
  .okbox{background:#052e1a;border:1px solid #114d2a;color:#b3f7c1}
  .errbox{background:#3b0d0d;border:1px solid #5b1919;color:#ffd0d0}
  .warnbox{background:#3a2903;border:1px solid #5c4307;color:#ffe6b0}
</style>
</head>

<div class="wrap">

    <h1>BFP – Bateria Fatorial de Personalidade</h1>

        <div id="progress" class="muted"></div>
      </div>
      <div id="msg" class="msg" style="display:none"></div>
    </form>

    <div id="alert" class="msg" style="display:none"></div>

function setBox(id, text, kind = "ok") {
  const el = $(id);

function maskCPF(cpf) {
  const d = onlyDigits(cpf || "");
  if (d.length !== 11) return cpf || "";
  return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`;
}

function fmtDateISO(iso) {
  if (!iso) return "";
  if (iso.includes("T")) {
    const dt = new Date(iso);
    if (!isNaN(dt)) {
      return dt.toLocaleDateString("pt-BR");
    }
  }
  const [y, m, d] = String(iso).split("-");
  return (y && m && d) ? `${d}/${m}/${y}` : iso;
}

function normalizeCPF(cpf) {
  return String(cpf || "").replace(/\D/g, "");
}

function getCpfFromUrl() {
  const params = new URLSearchParams(window.location.search);

  let cpf = params.get("cpf");
  if (cpf) return normalizeCPF(cpf);

  const raw = window.location.search.replace("?", "").trim();
  if (/^\d{11}$/.test(raw)) return raw;

  return "";
}

function getTestCodeFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("code") || TEST_CODE_FIXO;
}

function isObject(v) {
  return v && typeof v === "object" && !Array.isArray(v);
}

function containsTestCode(jsonb, testCode) {
  if (!jsonb) return false;

  if (typeof jsonb === "string") {
    return jsonb === testCode;
  }

  if (Array.isArray(jsonb)) {
    return jsonb.some(item => {
      if (typeof item === "string") return item === testCode;
      if (isObject(item)) {
        return item.code === testCode || item.test_code === testCode || item.id === testCode || containsTestCode(item, testCode);
      }
      return false;
    });
  }

  if (isObject(jsonb)) {
    if (Object.prototype.hasOwnProperty.call(jsonb, testCode)) {
      const value = jsonb[testCode];
      if (value !== false && value !== null && value !== undefined) return true;
      return false;
    }

    if (jsonb.code === testCode || jsonb.test_code === testCode || jsonb.id === testCode) {
      return true;
    }

    return Object.values(jsonb).some(v => containsTestCode(v, testCode));
  }

  return false;
}

function isTestLiberado(testsLiberados, testCode) {
  if (!containsTestCode(testsLiberados, testCode)) return false;

  if (isObject(testsLiberados) && Object.prototype.hasOwnProperty.call(testsLiberados, testCode)) {
    const v = testsLiberados[testCode];
    if (typeof v === "boolean") return v;
    if (isObject(v) && "liberado" in v) return Boolean(v.liberado);
    if (typeof v === "string") return !["false", "0", "nao", "não"].includes(v.toLowerCase());
    return Boolean(v);
  }

  return true;
}

function isTestFeito(testsFeitos, testCode) {
  if (!containsTestCode(testsFeitos, testCode)) return false;

  if (isObject(testsFeitos) && Object.prototype.hasOwnProperty.call(testsFeitos, testCode)) {
    const v = testsFeitos[testCode];
    if (typeof v === "boolean") return v;
    if (isObject(v) && "feito" in v) return Boolean(v.feito);
    if (typeof v === "string") return !["false", "0", "nao", "não"].includes(v.toLowerCase());
    return Boolean(v);
  }

  return true;
}

function normalizeTestsFeitosForSave(current) {
  const out = {};

  if (!current) return out;

  if (typeof current === "string") {
    out[current] = { feito: true };
    return out;
  }

  if (Array.isArray(current)) {
    current.forEach(item => {
      if (typeof item === "string") {
        out[item] = { feito: true };
      } else if (isObject(item)) {
        const code = item.code || item.test_code || item.id;
        if (code) {
          out[code] = {
            ...item,
            feito: ("feito" in item) ? Boolean(item.feito) : true
          };
        }
      }
    });
    return out;
  }

  if (isObject(current)) {
    Object.entries(current).forEach(([key, value]) => {
      if (typeof value === "boolean") {
        out[key] = { feito: value };
      } else if (typeof value === "string") {
        out[key] = { feito: !["false", "0", "nao", "não"].includes(value.toLowerCase()) };
      } else if (isObject(value)) {
        out[key] = { ...value };
      } else {
        out[key] = { feito: Boolean(value) };
      }
    });
  }

  return out;
}

function buildUpdatedTestsFeitos(currentTestsFeitos, testCode, submittedAtIso) {
  const next = normalizeTestsFeitosForSave(currentTestsFeitos);

  next[testCode] = {
    ...(isObject(next[testCode]) ? next[testCode] : {}),
    feito: true,
    submitted_at: submittedAtIso
  };

  return next;
}

function renderQuestions() {

  host.innerHTML = "";

  for (let i = 1; i <= N_ITEMS; i++) {
    const qn = String(i).padStart(3, "0");
    const label = ITEM_TEXT[i] || `Item ${i}${INVERTED.has(i) ? " (R)" : ""}`;

    wrap.className = "q";

    wrap.innerHTML = `<h3 id="lbl${qn}">${i}. ${label}</h3>`;

    const opts = document.createElement("div");
    opts.className = "opts";

    CHOICES.forEach((c, idx) => {
      const id = `q${qn}_${idx}`;
      const lab = document.createElement("label");

  };

  host.addEventListener("change", () => {
    updateProg();
    autosaveAnswers();
  });

  updateProg();

function autosaveAnswers() {
  const answers = {};
  for (let i = 1; i <= N_ITEMS; i++) {
    const qn = `q${String(i).padStart(3, "0")}`;
    const sel = document.querySelector(`input[name="${qn}"]:checked`);
    if (sel) answers[i] = Number(sel.value);
  }
  localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ code: TEST_CODE_FIXO, cpf: CPF, answers }));
}

function restoreAutosave() {
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return;
    const { answers } = JSON.parse(raw) || {};
    if (!answers) return;

    Object.entries(answers).forEach(([i, val]) => {
      const qn = String(i).padStart(3, "0");
      const el = document.querySelector(`input[name="q${qn}"][value="${val}"]`);
      if (el) el.checked = true;
    });

    const answered = Object.keys(answers).length;
    $("#progress").textContent = `${answered}/${N_ITEMS} respondidas`;
  } catch (_) {}
}

function clearAutosave() {
  localStorage.removeItem(AUTOSAVE_KEY);

/* =========================
   CÁLCULO
========================= */
function meanOf(ids, answers) {
  if (!ids.length) return 0;
  let sum = 0;
  let n = 0;

  ids.forEach(i => {
    const raw = answers[i] ?? 0;
    if (!raw) return;
    const val = INVERTED.has(i) ? invertLikert(raw) : raw;
    sum += val;
    n++;
  });

  return n ? sum / n : 0;
}

function fmt(x) {
  return (Math.round(x * 100) / 100).toFixed(2);
}

function buildScores(answers) {
  const sums = {};

  sums.vulnerabilidade = meanOf(VULNERABILIDADE, answers);
  sums.instab_emocional = meanOf(INSTAB_EMOC, answers);
  sums.passividade = meanOf(PASSIVIDADE, answers);
  sums.depressao = meanOf(DEPRESSAO, answers);
  sums.neuroticismo = (sums.vulnerabilidade + sums.instab_emocional + sums.passividade + sums.depressao) / 4;

  sums.comunicacao = meanOf(COMUNICACAO, answers);
  sums.altivez = meanOf(ALTIVEZ, answers);
  sums.dinamismo = meanOf(DINAMISMO, answers);
  sums.interacoes_sociais = meanOf(INTERACOES_SOC, answers);
  sums.extroversao = (sums.comunicacao + sums.altivez + sums.dinamismo + sums.interacoes_sociais) / 4;

  sums.amabilidade = meanOf(AMABILIDADE, answers);
  sums.pro_sociabilidade = meanOf(PRO_SOC, answers);
  sums.confianca_pessoas = meanOf(CONFIANCA_PESS, answers);
  sums.socializacao = (sums.amabilidade + sums.pro_sociabilidade + sums.confianca_pessoas) / 3;

  sums.competencia = meanOf(COMPETENCIA, answers);
  sums.ponderacao = meanOf(PONDERACAO, answers);
  sums.empenho = meanOf(EMPENHO, answers);
  sums.realizacao = (sums.competencia + sums.ponderacao + sums.empenho) / 3;

  sums.ab_ideias = meanOf(AB_IDEIAS, answers);
  sums.liberalismo = meanOf(LIBERALISMO, answers);
  sums.busca_novidades = meanOf(BUSCA_NOV, answers);
  sums.abertura = (sums.ab_ideias + sums.liberalismo + sums.busca_novidades) / 3;

  let globalSum = 0;
  let globalN = 0;
  for (let i = 1; i <= N_ITEMS; i++) {
    const raw = answers[i];
    if (!raw) continue;
    const val = INVERTED.has(i) ? invertLikert(raw) : raw;
    globalSum += val;
    globalN++;
  }
  sums.media_global = globalN ? globalSum / globalN : 0;
  sums.total_respondido = globalN;

  return sums;
}

function buildResultsPerguntasRespostas(answers) {
  const respostas = [];

  for (let i = 1; i <= N_ITEMS; i++) {
    const raw = answers[i];
    if (!raw) continue;

    respostas.push({
      pergunta: `${i}. ${ITEM_TEXT[i] || `Item ${i}`}`,
      resposta: String(raw)
    });
  }

  return respostas;
}

function buildResultsMetaArray(sums, durationSec) {
  const resultsMetaPayload = [];
  let metaOrder = 1;

  const pushMeta = (key, label, value, extra = {}) => {
    resultsMetaPayload.push({
      order: metaOrder++,
      key,
      label,
      value: Number(value.toFixed(4)),
      ...extra
    });
  };

  pushMeta("vulnerabilidade", "Vulnerabilidade", sums.vulnerabilidade);
  pushMeta("instabilidade_emocional", "Instabilidade emocional", sums.instab_emocional);
  pushMeta("passividade", "Passividade", sums.passividade);
  pushMeta("depressao", "Depressão", sums.depressao);
  pushMeta("neuroticismo", "Neuroticismo", sums.neuroticismo);

  pushMeta("comunicacao", "Comunicação", sums.comunicacao);
  pushMeta("altivez", "Altivez", sums.altivez);
  pushMeta("dinamismo", "Dinamismo", sums.dinamismo);
  pushMeta("interacoes_sociais", "Interações sociais", sums.interacoes_sociais);
  pushMeta("extroversao", "Extroversão", sums.extroversao);

  pushMeta("amabilidade", "Amabilidade", sums.amabilidade);
  pushMeta("pro_sociabilidade", "Pró-sociabilidade", sums.pro_sociabilidade);
  pushMeta("confianca_nas_pessoas", "Confiança nas pessoas", sums.confianca_pessoas);
  pushMeta("socializacao", "Socialização", sums.socializacao);

  pushMeta("competencia", "Competência", sums.competencia);
  pushMeta("ponderacao", "Ponderação", sums.ponderacao);
  pushMeta("empenho", "Empenho e comprometimento", sums.empenho);
  pushMeta("realizacao", "Realização", sums.realizacao);

  pushMeta("abertura_ideias", "Abertura a ideias", sums.ab_ideias);
  pushMeta("liberalismo", "Liberalismo", sums.liberalismo);
  pushMeta("busca_novidades", "Busca por novidades", sums.busca_novidades);
  pushMeta("abertura", "Abertura", sums.abertura);

  pushMeta("media_global", "Média global", sums.media_global, {
    answeredCount: sums.total_respondido,
    durationSec
  });

  return resultsMetaPayload;
}

/* =========================
   BOOT
========================= */
(async function boot() {
  try {
    const cpf = getCpfFromUrl();
    const testCode = getTestCodeFromUrl();

    if (!cpf || cpf.length !== 11) {
      throw new Error("CPF inválido ou ausente na URL.");
    }

    if (!testCode) {
      throw new Error("Código do teste não informado.");
    }

    CPF = cpf;

    const { data, error } = await supabaseClient
      .from("patients")
      .select("cpf, nome, data_nascimento, email, whatsapp, tests_liberados, tests_feitos")
      .eq("cpf", cpf)
      .maybeSingle();

    if (error) throw new Error("Erro ao consultar paciente.");
    if (!data) throw new Error("CPF não encontrado.");

    patient = data;

    const liberado = isTestLiberado(data.tests_liberados, testCode);
    if (!liberado) {
      setBox("#alert", "Este formulário não está liberado para você. Entre em contato com o consultório.", "err");
      return;
    }

    const feito = isTestFeito(data.tests_feitos, testCode);
    if (feito) {
      setBox("#alert", "Você já respondeu este formulário. Voltando para a área do paciente…", "ok");
      setTimeout(() => redirectToAreaPaciente(cpf), 1200);
      return;
    }

    renderPatientInfo();
    renderQuestions();
    $("#pacInfo").style.display = "grid";
    $("#form").style.display = "block";
    hideBox("#alert");
    startAt = Date.now();
    restoreAutosave();
  } catch (err) {
    console.error(err);
    setBox("#alert", err.message || "Falha ao abrir o formulário. Tente novamente mais tarde.", "err");
  }
})();

/* =========================
   SUBMIT
========================= */
let sending = false;

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (sending) return;

  sending = true;
  hideBox("#msg");

  const btn = $("#btnSubmit");
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Enviando…";

  try {
    if (!patient) throw new Error("Sessão inválida. Recarregue a página.");

    const cpf = getCpfFromUrl();
    const testCode = getTestCodeFromUrl();
    const submittedAt = new Date().toISOString();

    const answers = {};
    let firstMissing = null;

    for (let i = 1; i <= N_ITEMS; i++) {
      const qn = `q${String(i).padStart(3, "0")}`;
      const sel = document.querySelector(`input[name="${qn}"]:checked`);
      if (!sel && firstMissing === null) firstMissing = i;
      if (sel) answers[i] = Number(sel.value);
    }

    if (firstMissing) {
      setBox("#msg", `Responda o item ${firstMissing}.`, "warn");
      document.getElementById(`lbl${String(firstMissing).padStart(3, "0")}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
      sending = false;
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

    const { data: patientFresh, error: patientError } = await supabaseClient
      .from("patients")
      .select("cpf, tests_liberados, tests_feitos")
      .eq("cpf", cpf)
      .maybeSingle();

    if (patientError) throw new Error("Erro ao consultar paciente.");
    if (!patientFresh) throw new Error("CPF não encontrado.");

    const liberado = isTestLiberado(patientFresh.tests_liberados, testCode);
    if (!liberado) throw new Error("Teste não liberado.");

    const jaFeito = isTestFeito(patientFresh.tests_feitos, testCode);
    if (jaFeito) {
      redirectToAreaPaciente(cpf);
      return;
    }

    const sums = buildScores(answers);
    const durationSec = Math.round((Date.now() - startAt) / 1000);

    const resultsPayload = buildResultsPerguntasRespostas(answers);
    const resultsMetaPayload = buildResultsMetaArray(sums, durationSec);

    const { error: insertError } = await supabaseClient
      .from("respostas")
      .insert([
        {
          cpf: cpf,
          code: testCode,
          submitted_at: submittedAt,
          results: resultsPayload,
          results_meta: resultsMetaPayload
        }
      ]);

    if (insertError) {
      console.error("ERRO INSERT respostas:", insertError);
      throw new Error(
        `Erro ao salvar respostas: ${insertError.message || ""} ${insertError.details || ""} ${insertError.hint || ""}`.trim()
      );
    }

    const nextTestsFeitos = buildUpdatedTestsFeitos(patientFresh.tests_feitos, testCode, submittedAt);

    const { error: updateError } = await supabaseClient
      .from("patients")
      .update({
        tests_feitos: nextTestsFeitos
      })
      .eq("cpf", cpf);

    if (updateError) {
      console.error(updateError);
      throw new Error("Resposta salva, mas falhou ao marcar teste como feito.");
    }

    clearAutosave();
    setBox("#msg", "Formulário enviado. Retornando para a área do paciente…", "ok");
    setTimeout(() => redirectToAreaPaciente(cpf), 1200);

  } catch (err) {
    console.error(err);
    setBox("#msg", err.message || "Falha ao enviar. Tente novamente.", "err");
    sending = false;
    btn.disabled = false;
    btn.textContent = originalText;
  }
});
</script>
